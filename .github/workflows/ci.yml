name: AV Silks CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: av-silks-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Backend tests
        run: npm test

      - name: Backend production dependency audit
        run: npm audit --omit=dev --omit=optional --audit-level=moderate

  frontend:
    name: Frontend Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: node --test test/*.test.js

      - name: Frontend production build
        run: npm run build

      - name: Frontend production dependency audit
        run: npm audit --omit=dev --audit-level=high
